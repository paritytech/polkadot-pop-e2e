[workspace]
resolver = "3"
members = ["people-plugin", "proofs"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Polkameter, pinned to one commit: the plugin SDK and the libraries the Recycler observer reuses.
polkameter-plugin-sdk = { git = "https://github.com/agustinustheo/polkameter", rev = "3efb54af0f10f5f670e6177e8db5af8d7150d1de" }
polkameter-chain = { git = "https://github.com/agustinustheo/polkameter", rev = "3efb54af0f10f5f670e6177e8db5af8d7150d1de" }
polkameter-files = { git = "https://github.com/agustinustheo/polkameter", rev = "3efb54af0f10f5f670e6177e8db5af8d7150d1de" }
polkameter-monitors = { git = "https://github.com/agustinustheo/polkameter", rev = "3efb54af0f10f5f670e6177e8db5af8d7150d1de" }
polkameter-checks = { git = "https://github.com/agustinustheo/polkameter", rev = "3efb54af0f10f5f670e6177e8db5af8d7150d1de" }
ring-proofs = { path = "proofs" }

anyhow = "1"
hex = "0.4"
parity-scale-codec = { version = "3.7", features = ["derive"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp-crypto-hashing = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
# Without `std`: its `ark-vrf/parallel` builds a rayon pool inside every MSM, and a long
# proving run then runs out of threads (EAGAIN). One proof per thread is faster anyway.
verifiable = { version = "=0.3.0", default-features = false, features = ["no-std-prover"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
too_many_lines = "warn"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 3
