name: Coinage claim burst on PreviewNet

on:
  workflow_dispatch:
    inputs:
      users:
        description: Claims after the mandatory one-claim smoke test (1–1000000)
        type: string
        default: '1000'
      mode:
        description: Single burst or two waves (paced requires 10000 claims)
        type: choice
        options: [burst, paced]
        default: burst
      first_wave:
        description: First paced wave (1–9999); remainder follows verified finalization
        type: string
        default: '8000'
      pool:
        description: People-node pool capacity (keep default for the paced experiment)
        type: choice
        options: [default, enlarged]
        default: default
      pool_transactions:
        description: Ready-pool entry limit when enlarged (11000–1100000); byte budget configured separately
        type: string
        default: '11000'
      fixture_batch:
        description: Root-seeded coins per setup transaction (100–5000); outside measured burst
        type: string
        default: '1000'
      launch_target_ms:
        description: Maximum client launch window (1000–60000 ms); recorded separately from finality
        type: string
        default: '1000'
      pool_kbytes:
        description: Ready-pool byte budget in KiB when enlarged (40960–262144)
        type: string
        default: '40960'
      drain_timeout_ms:
        description: Per-wave watch deadline (600000–3600000 ms)
        type: string
        default: '600000'
  push:
    branches: [feat/th-coinage-claim-burst]
    paths:
      - .github/workflows/coinage-claim-burst.yml
      - packages/chain-tests/src/lib/coinage-capacity*
      - packages/chain-tests/src/lib/coinage-client*
      - packages/chain-tests/src/lib/coinage-burst-audit*
      - packages/chain-tests/src/lib/coinage-burst-submit*
      - packages/chain-tests/scripts/coinage-claim-burst.ts
      - ci/previewnet/**

permissions:
  contents: read
  actions: read

concurrency:
  group: coinage-claim-burst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  burst:
    runs-on: parity-large
    timeout-minutes: 720
    env:
      GH_TOKEN: ${{ github.token }}
      # Keep the capacity series on the same snapshot even if the bites release changes.
      PREVIEWNET_BUNDLE_RUN_ID: '36614342201'
      PREVIEWNET_BUNDLE_SHA256: edab76b213657e499ae9fcb95673a2bf4ca717b78b00caf3d7783fc18b562b4f
      NODE_OPTIONS: --max-old-space-size=24576
      POOL_KBYTES: ${{ inputs.pool_kbytes || '40960' }}
      DRAIN_TIMEOUT_MS: ${{ inputs.drain_timeout_ms || '600000' }}
      ACTOR_COUNT: ${{ inputs.users || '1000' }}
      LOAD_MODE: ${{ inputs.mode || 'burst' }}
      FIRST_WAVE: ${{ inputs.first_wave || '8000' }}
      POOL_PROFILE: ${{ inputs.pool || 'default' }}
      POOL_TRANSACTIONS: ${{ inputs.pool_transactions || '11000' }}
      FIXTURE_BATCH: ${{ inputs.fixture_batch || '1000' }}
      LAUNCH_TARGET_MS: ${{ inputs.launch_target_ms || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate requested load and client
        run: |
          python3 -c 'import os; n=int(os.environ["ACTOR_COUNT"]); assert 1 <= n <= 1000000; assert 11000 <= int(os.environ["POOL_TRANSACTIONS"]) <= 1100000; assert 100 <= int(os.environ["FIXTURE_BATCH"]) <= 5000; assert 1000 <= int(os.environ["LAUNCH_TARGET_MS"]) <= 60000; assert 40960 <= int(os.environ["POOL_KBYTES"]) <= 262144; assert 600000 <= int(os.environ["DRAIN_TIMEOUT_MS"]) <= 3600000; assert os.environ["LOAD_MODE"] != "paced" or (n == 10000 and 1 <= int(os.environ["FIRST_WAVE"]) < n)'
          pip install tomli-w==1.2.0
          pnpm install --frozen-lockfile
          pnpm --filter @pop-e2e/chain-tests test:coinage-client
          pnpm --filter @pop-e2e/chain-tests exec tsx --test src/lib/coinage-burst-audit.test.ts src/lib/coinage-burst-submit.test.ts src/lib/coinage-capacity.test.ts
      - uses: actions/checkout@v4
        with:
          repository: paritytech/previewnet-engine
          ref: 7907a3bfa7b2e47535a74b7920086a05ca94773a
          path: ppn
      - name: Prepare the PreviewNet engine network from PR 32
        run: |
          bash ci/previewnet/prepare.sh network-inputs
          sha256sum --check network-inputs/network-inputs.sha256
          tar -xzf network-inputs/network-inputs.tar.gz -C ppn
          pnpm --dir ppn install --frozen-lockfile
          pnpm --dir ppn exec tsc -b
          node ppn/bin/ppn.mjs fork toml ppn/bundle ppn/full-fork.toml
          python3 ci/previewnet/network.py prepare --people-collators 2
          # Make RPC limits explicit; change pool limits only for the separate experiment.
          python3 - <<'PY'
          from pathlib import Path
          import os, tomllib, tomli_w
          path = Path('network-out/network.toml')
          config = tomllib.loads(path.read_text())
          people = next(p for p in config['parachains'] if p['id'] == 1502)
          for node in people['collators']:
              node['args'] = [a for a in node['args'] if not a.startswith(('--rpc-max-connections=', '--state-pruning='))]
              node['args'] += ['--rpc-max-connections=1024', '--state-pruning=10000']
              subscriptions = max(20050, 2 * int(os.environ['ACTOR_COUNT']) + 50)
              node['args'] += [f'--rpc-max-subscriptions-per-connection={subscriptions}', '--offchain-worker=always']
              if os.environ['POOL_PROFILE'] == 'enlarged':
                  node['args'] += [f"--pool-limit={os.environ['POOL_TRANSACTIONS']}", f"--pool-kbytes={os.environ['POOL_KBYTES']}"]
          path.write_text(tomli_w.dumps(config))
          PY
          cp ppn/provenance.json network-out/
          cp ppn/bundle/manifest.json network-out/snapshot.json
      - name: Start six relay validators and two People collators
        run: |
          python3 ci/previewnet/start.py start
          node ppn/bin/ppn.mjs fork wait ppn/bundle 900
          node ci/previewnet/people-collators.mjs setup
          python3 ci/previewnet/network.py observe --phase baseline
      - name: Check claim driver types
        working-directory: packages/chain-tests
        run: >-
          pnpm exec tsc --noEmit --target es2022 --module esnext
          --moduleResolution bundler --strict --skipLibCheck scripts/coinage-claim-burst.ts
      - name: Run smoke claim and requested burst
        working-directory: packages/chain-tests
        run: |
          (while true; do date -u; ps -eo pid,ppid,pcpu,rss,comm; sleep 10; done) > ../../network-out/process-samples.txt &
          monitor_pid=$!
          python3 ../../ci/previewnet/monitor.py --directory ../../network-out &
          metrics_pid=$!
          trap 'kill "$monitor_pid" "$metrics_pid" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=30s 660m pnpm exec tsx scripts/coinage-claim-burst.ts
      - name: Verify saved claim evidence
        if: always()
        run: python3 ci/previewnet/verify-burst-artifact.py network-out --stage claim-burst --expected "$ACTOR_COUNT"
      - name: Save claim results before recovery checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinage-claim-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            network-out/*.json
            network-out/*.jsonl
            network-out/process-samples.txt
            network-out/*.md
            network-out/*.csv
            network-out/evidence/**
          retention-days: 30
      - name: Summarise available results
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Coinage claim burst\n\n0 ms added delay; root-seeded, asset-backed coins; one signed transfer per coin. Issuance and wallet behavior are outside this pilot.\n\n')
              report = Path('network-out/claim-burst-report.md')
              if report.exists():
                  out.write(report.read_text() + '\n\n')
              for name in ('claim-smoke-summary', 'claim-burst-summary', 'claim-burst-audit', 'claim-error'):
                  path = Path(f'network-out/{name}.json')
                  out.write(f'### {name}\n\n')
                  out.write('```json\n' + json.dumps(json.loads(path.read_text()), indent=2) + '\n```\n\n' if path.exists() else 'No result produced.\n\n')
          PYTHON
      - name: Check network recovery and both People authors
        if: always()
        timeout-minutes: 9
        run: |
          python3 ci/previewnet/network.py observe --phase recovery
          node ci/previewnet/people-collators.mjs verify
      - name: Stop this run's network
        if: always()
        run: python3 ci/previewnet/start.py stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coinage-claim-burst-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            network-out/*.json
            network-out/*.jsonl
            network-out/*.toml
            network-out/*.txt
            network-out/*.log
            network-out/data/*/*.log
            network-out/*.md
            network-out/*.csv
            network-out/evidence/**
          retention-days: 30
