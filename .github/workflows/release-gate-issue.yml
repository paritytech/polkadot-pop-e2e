name: Release Gate (issue trigger)

# The issue-form channel into the release gate: an issue created from the
# "Release gate request" template carries a network and a sparse target overlay;
# this workflow validates the ask, dispatches the Release Gate with it, and
# comments the run link back on the issue. The gate itself is untouched — this is
# the same `workflow_dispatch` a human (or a future GH Pages UI) would fire.

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write

jobs:
  dispatch:
    if: contains(github.event.issue.labels.*.name, 'release-gate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # One field per override (environments/gate-form.mjs assembles the overlay —
      # requesters never write the JSON shape; the advanced textarea still can).
      # That module is also what the gate's own dispatch form reads, so the two
      # channels offer the same fields.
      - name: Parse the request
        id: parse
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" | node environments/gate-form.mjs issue > /tmp/ask.json
          {
            echo "network=$(jq -r .network /tmp/ask.json)"
            echo "target=$(jq -c '.target // empty' /tmp/ask.json)"
          } >> "$GITHUB_OUTPUT"

      # Fail fast with a useful comment when the overlay is malformed — before any
      # beefy runner spins up.
      - name: Validate the overlay against the canonical manifest
        id: validate
        # Issue text goes to the shell only through env, never through ${{ }}.
        env:
          NETWORK: ${{ steps.parse.outputs.network }}
          TARGET: ${{ steps.parse.outputs.target }}
        run: |
          TARGET_ARGS=""
          if [ -n "$TARGET" ]; then
            printf '%s' "$TARGET" > /tmp/target-overlay.json
            TARGET_ARGS="--target /tmp/target-overlay.json"
          fi
          # shellcheck disable=SC2086 # TARGET_ARGS is deliberately two words
          if node environments/resolve.mjs candidates "environments/networks/$NETWORK.json" \
               $TARGET_ARGS > /dev/null 2> /tmp/validate.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject an invalid request
        if: steps.validate.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK: ${{ steps.parse.outputs.network }}
        run: |
          {
            echo "The target overlay did not validate:"
            echo '```'
            tail -5 /tmp/validate.log
            echo '```'
            echo "Allowed sources for **$NETWORK** (pins are \`owner/repo@tag\`):"
            node environments/resolve.mjs sources "environments/networks/$NETWORK.json"
            echo ""
            echo "Fix the JSON in the issue body and open a new request (edits do not re-trigger)."
          } > /tmp/comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/comment.md
          exit 1

      - name: Dispatch the gate and link the run
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK: ${{ steps.parse.outputs.network }}
          TARGET: ${{ steps.parse.outputs.target }}
        run: |
          # The assembled overlay goes in as `advanced`: it is already the full
          # JSON shape, so it replaces the dispatch form's per-field inputs.
          gh workflow run release-gate.yml --ref "${{ github.event.repository.default_branch }}" \
            -f environment="$NETWORK" \
            -f advanced="$TARGET"
          sleep 10
          run_url=$(gh run list --workflow release-gate.yml --limit 1 --json url --jq '.[0].url')
          {
            if [ -n "$TARGET" ]; then
              echo "Release Gate dispatched for **$NETWORK** with:"
              echo '```json'
              printf '%s\n' "$TARGET"
              echo '```'
            else
              echo "Release Gate dispatched for **$NETWORK** — no overrides, a steady-state assertion run."
            fi
            echo "Run: ${run_url:-see Actions → Release Gate}"
          } > /tmp/comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/comment.md
