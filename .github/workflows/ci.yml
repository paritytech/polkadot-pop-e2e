name: CI

# `check` is offline: no chain, no RPC, no secrets. `live` runs the suite on a
# local fork of previewnet through the release gate, with the engine's own
# identity backend, so a PR is not failed by an outage on the live network.
# The live network itself is watched by the health cron in triangle-e2e.
#
# `check` exists because the environments tests previously ran in no workflow at
# all, which is how three of them sat red on main for two days after the
# baseline scan bumped a manifest pin the fixtures depended on.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # Descriptors are generated from live chain metadata by the postinstall, and
      # chain-tests cannot typecheck without them — so this install does NOT skip
      # scripts. If an upstream chain is unreachable the job fails here, loudly,
      # which is the correct signal: the daily PAPI refresh has drifted.
      - run: pnpm install --frozen-lockfile

      - name: Unit tests (release map, resolver, gate form)
        run: pnpm test:environments

      - name: Typecheck the suite
        run: pnpm --filter @pop-e2e/chain-tests exec tsc --noEmit -p .

      # The manifests are the gate's input; a malformed one should fail here in
      # seconds rather than after a runner has spent 25 minutes forking a network.
      - name: Every manifest resolves
        run: |
          set -euo pipefail
          for m in environments/networks/*.json; do
            echo "::group::$m"
            node environments/resolve.mjs tests "$m"
            echo "::endgroup::"
          done

  changes:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.diff.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # environments/** and release-gate.yml already trigger the gate on their own.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "suite=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(packages/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "suite=true" >> "$GITHUB_OUTPUT"
          else
            echo "suite=false" >> "$GITHUB_OUTPUT"
          fi

  live:
    # A steady-state gate run: fork previewnet, upgrade nothing, run the suite.
    name: live suite (previewnet fork)
    needs: changes
    if: needs.changes.outputs.suite == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-gate.yml
    with:
      environment: previewnet
