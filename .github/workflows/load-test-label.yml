name: Load test (PR label)

# Temporary, until load-test.yml is on main and can be dispatched. On a pull request:
# - `load-test-previewnet`: 300 bots play the closest previewnet game, signalling as the app does
# - `load-test-paseo`: 1000 bots play the closest paseo-next-v2 game, signalling as the app does
# - `load-test-paseo-spread`: the same, but each bot re-sends on a beat of its own instead of the
#   app's one shared beat, the experiment for spreading the pre-game burst

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  previewnet:
    # Self-hosted runners: never for pull requests from forks.
    if: github.event.label.name == 'load-test-previewnet' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/load-test.yml
    with:
      network: previewnet
      players: "300"
    secrets:
      TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}

  paseo:
    if: github.event.label.name == 'load-test-paseo' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/load-test.yml
    with:
      network: paseo-next-v2
      players: "1000"
    secrets:
      TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}

  paseo-spread:
    if: github.event.label.name == 'load-test-paseo-spread' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/load-test.yml
    with:
      network: paseo-next-v2
      players: "1000"
      args: "--phase random"
    secrets:
      TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}
