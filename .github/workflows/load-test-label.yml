name: Load test (PR label)

# Temporary, until load-test.yml is on main and can be dispatched: on a pull request, the
# `load-test-previewnet` label has 300 bots play the closest previewnet game in one room as the
# app does, and `load-test-previewnet-tables` and `load-test-paseo-tables` have 1000 bots play
# the closest previewnet or paseo-next-v2 game with one topic per table.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  load:
    # Self-hosted runners: never for pull requests from forks.
    if: github.event.label.name == 'load-test-previewnet' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/load-test.yml
    with:
      network: previewnet
      players: "300"
    secrets:
      TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}

  tables:
    if: github.event.label.name == 'load-test-previewnet-tables' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/load-test.yml
    with:
      network: previewnet
      players: "1000"
      args: "--rooms tables"
    secrets:
      TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}

  paseo-tables:
    if: github.event.label.name == 'load-test-paseo-tables' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/load-test.yml
    with:
      network: paseo-next-v2
      players: "1000"
      args: "--rooms tables"
    secrets:
      TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}
