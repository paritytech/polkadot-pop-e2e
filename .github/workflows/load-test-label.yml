name: Load test (PR label)

# Temporary, until load-test.yml is on main and can be dispatched: the `load-test` label on a
# pull request plays the signalling layer with 100, 200 and 300 players on previewnet forks.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  load:
    # Self-hosted runners: never for pull requests from forks.
    if: github.event.label.name == 'load-test' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/load-test.yml
    with:
      target: fork-previewnet
      layer: signalling
      steps: "100,200,300"
