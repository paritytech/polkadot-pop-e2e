name: Release Gate

# Pre-release gate, driven by the canonical environment manifests in environments/:
# fork the live network, spawn it on the manifest's binaries, converge every chain's
# runtime to the manifest's pins (byte-identical → no-op, different → a real on-chain
# upgrade), then run the manifest's chain-tests against the upgraded environment.
#
# The manifest diff is the test plan. A PR that moves BOTH binaries and runtimes fans
# out into a candidate matrix — the target state (gating) plus two informational cross
# terms: new binaries × current runtimes ("can the fleet bump binaries first?") and
# current binaries × new runtimes ("does the upgrade enact without the binary bump?").
# Single-dimension PRs collapse to one run. Merging the PR records the gated state.
#
# The payload is packages/chain-tests: every candidate run ends with
# `pnpm --filter @pop-e2e/chain-tests <script>` (per the manifest's `tests:`)
# against the upgraded fork via NETWORK=local-fork.
#
# The engine is paritytech/preview-net-v1 (`make start FORK=1`, `make runtime-upgrade`);
# this workflow only composes it. See environments/README.md.

on:
  pull_request:
    paths:
      - "environments/**"
      - ".github/workflows/release-gate.yml"
  # The machine-facing door: another repo's CI calls this when it cuts a release.
  # Deliberately NOT the ten per-field inputs below — a calling workflow builds the
  # overlay programmatically, so one JSON blob is friendlier there than ten fields,
  # and workflow_call gets its own input budget separate from workflow_dispatch's.
  workflow_call:
    inputs:
      environment:
        description: >
          Networks to gate, comma-separated — e.g. `previewnet,paseo-next-v2`.
          Each gets its own fork, and the same overlay is applied to each.
        type: string
        required: true
      advanced:
        description: >
          Sparse target overlay (JSON) — the pins to test. May carry `ppn_ref`.
          Empty = a steady-state assertion run.
        type: string
        required: false
      runtime_artifact:
        description: >
          Artifact name or glob in the CALLING run holding freshly built runtime
          wasm. `*-runtime` collects a build matrix that uploads one artifact
          each. A called workflow's jobs live in the caller's run, so a plain
          download reaches them — no token, no cross-repo API.

          Files are matched to chains by the asset names the releases use, e.g.
          next_asset_hub_paseo_runtime.compact.compressed.wasm. Upload the build
          output under those names and name nothing here but the artifact.
          Chains with no matching file stay on their canonical pin, so a partial
          build gates only what it built.
        type: string
        required: false
      runs_on:
        description: >
          Runner label for the fork job.

          Defaults to `parity-large`, which is what Parity runs on.

          A reusable workflow runs on the CALLER's runners, not this repo's, so a
          caller outside Parity passes a label of their own. `ubuntu-latest` is
          enough: a full run — spawn five chains, converge, test — finished on one
          in 32 minutes (2026-08-28), against ~25 on parity-large.
        type: string
        required: false
        default: parity-large
    secrets:
      GH_PAT:
        description: Read access to the engine repo and the pinned release sources.
        required: true

  # One field per override, mirroring the "Release gate request" issue form — the
  # field list lives in environments/gate-form.mjs and both channels read it, so
  # they cannot drift. Fill in only what you want tested; every empty field stays
  # at the canonical (deployed) pin from environments/networks/<environment>.json.
  # Every pin is an `owner/repo@tag` release ref; which release ASSET to take is
  # resolved per network, so you never name files.
  #
  # `@latest` is accepted everywhere and resolves through the repo's GitHub "latest
  # release", with the run log naming the concrete tag it landed on. It is only
  # SAFE on repos whose latest release is the one you mean — preview-net-v1,
  # polkadot-sdk, release-automation, web3-storage, device-uniqueness-backend.
  # Three sources where it misfires, verified 2026-08-25:
  #   - paseo-network/runtimes@latest → v2.4.3 while production runs v2.4.4 (GitHub
  #     ranks releases/latest by tag created_at, not publish date), so the gate
  #     rejects it as a downgrade.
  #   - paritytech/individuality-community@latest → 404: every release there is a
  #     prerelease nightly, and releases/latest skips prereleases.
  #   - flavored repos (polkadot-bulletin-chain, individuality) resolve to whichever
  #     flavor sorts first, not your network's — individuality@latest is the
  #     -previewnet build, wrong for paseo-next-v2.
  # Pin an exact tag whenever you want the run to stay reproducible.
  #
  # workflow_dispatch caps at 10 inputs, which is what `advanced` is for: it holds
  # the asks no field expresses (a `tests` list, asset-hub split from people, a
  # `ppn_ref`) and REPLACES every field above it when filled.
  workflow_dispatch:
    inputs:
      environment:
        description: Networks to gate — one, or a comma-separated pair
        type: choice
        options:
          - previewnet
          - paseo-next-v2
          - devnet
          - previewnet,paseo-next-v2
        default: previewnet
      binary_polkadot:
        description: >
          Node binary polkadot (+ its PVF workers) — the fork SPAWNS on it. From
          paritytech/preview-net-v1, paritytech/polkadot-sdk or
          paritytech/release-automation (complete tags only — some
          release-automation releases are partial re-publishes). `@latest` is safe
          on all three. e.g. paritytech/preview-net-v1@latest or
          paritytech/release-automation@polkadot-weekly2026w34-rc1
        required: false
      binary_polkadot_omni_node:
        description: >
          Node binary polkadot-omni-node — one file every parachain execs, so this
          moves all of them together. Same sources as polkadot, `@latest` equally
          safe. e.g. paritytech/preview-net-v1@latest or
          paritytech/polkadot-sdk@polkadot-stable2606-1
        required: false
      runtime_relay:
        description: >
          Runtime relay — UPGRADED from whatever production runs to this release; a
          byte-identical pin is a no-op assertion, an older one fails as stale. From
          paseo-network/runtimes (previewnet also: paritytech/preview-net-v1). Do
          NOT use paseo-network/runtimes@latest — it resolves to v2.4.3, behind the
          deployed v2.4.4, and the gate rejects the downgrade.
          e.g. paseo-network/runtimes@v2.4.5 or paritytech/preview-net-v1@latest
        required: false
      runtime_individuality:
        description: >
          Runtime asset-hub AND people — two runtimes out of one individuality build,
          so one pin moves both. previewnet/paseo-next-v2: paritytech/individuality,
          paritytech/individuality-community or paritytech/preview-net-v1; devnet:
          paseo-network/runtimes. `@latest` is flavor-blind here — individuality
          @latest is the -previewnet build (wrong for paseo-next-v2) and
          individuality-community@latest 404s (its nightlies are all prereleases),
          so name the tag. Split the two chains via `advanced`.
          e.g. paritytech/individuality@v0.12.0-previewnet
        required: false
      runtime_bulletin:
        description: >
          Runtime bulletin, from paritytech/polkadot-bulletin-chain — pin the
          network's flavor (…-paseo) explicitly, never @latest (it can resolve to a
          westend build). Not pinnable on devnet.
          e.g. paritytech/polkadot-bulletin-chain@v0.0.25-paseo
        required: false
      runtime_web3_storage:
        description: >
          Runtime web3-storage, from paritytech/web3-storage. previewnet only.
          `@latest` is safe. e.g. paritytech/web3-storage@v0.4.2-paseo or
          paritytech/web3-storage@latest
        required: false
      service_eth_rpc:
        description: >
          The eth-rpc sidecar the fork runs. Same sources as the node binaries,
          `@latest` equally safe. e.g. paritytech/preview-net-v1@latest or
          paritytech/release-automation@polkadot-weekly2026w34-rc1
        required: false
      service_identity_backend:
        description: >
          The identity service quadruple (identity-api, chain-writer,
          registration-queue, username-indexer — they travel together), from
          paritytech/device-uniqueness-backend. Empty runs the engine's default tag.
          previewnet only. `@latest` is safe.
          e.g. paritytech/device-uniqueness-backend@latest
        required: false
      advanced:
        description: >
          Raw target overlay (JSON) for asks the fields cannot express — REPLACES
          them when set. Also the only route for `ppn_ref` (the preview-net-v1 ref
          to take the engine from), e.g. {"ppn_ref":"mak/engine-branch"}. Shape:
          environments/README.md.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Engine default; a `ppn_ref` key in the dispatch form's `advanced` overlay
  # overrides it for ad-hoc runs against engine branches.
  # The gate targets the multi-network-workspace API (ppn CLI, PPN_BINARIES
  # overrides) — flip to `main` when preview-net-v1 #159 merges.
  PPN_REF_DEFAULT: main # multi-network-workspace merged (preview-net-v1#159) and its branch is gone
  # Comma-separated: one release can gate several networks. Individuality cuts a
  # runtime that is baked into BOTH previewnet and paseo-next-v2, so its CI asks
  # for both in one call and gets a fork of each.
  #
  # The fallback only fires for `pull_request` (dispatch and call always supply
  # one). A PR that edits no manifest — a change to this workflow, say — has no
  # diff to gate, and testing such a change against a single network would miss
  # anything network-shaped. So both, at two forks instead of one.
  ENVIRONMENTS: ${{ inputs.environment || 'previewnet,paseo-next-v2' }}

jobs:
  # Decompose the manifest change into candidates — cheap, fails fast on a bad
  # manifest before any beefy runner spins up.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ppn_ref: ${{ steps.ask.outputs.ppn_ref }}
    steps:
      # This workflow's OWN repo. A reusable workflow's `actions/checkout` takes
      # the CALLER's repository by default, so a call from elsewhere would check
      # that out and find none of the resolver, release map or manifests.
      #
      # Pinned to main, not to the caller's ref. `github.job_workflow_sha` and
      # `job_workflow_ref` are documented for reusable workflows but both come
      # back EMPTY in the github context (measured 2026-08-28) — they exist only
      # in OIDC claims. So a caller pinning @v1 runs main's logic; that is a real
      # limitation, not an oversight.
      - uses: actions/checkout@v4
        with:
          repository: paritytech/polkadot-pop-e2e
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fold the dispatch form's fields into the one sparse overlay the resolver
      # takes, and lift `ppn_ref` back out of it. No-op on a PR run (the manifest
      # diff is the ask there) — the fields are dispatch-only.
      - name: Assemble the ask
        id: ask
        env:
          GATE_BINARY_POLKADOT: ${{ inputs.binary_polkadot }}
          GATE_BINARY_POLKADOT_OMNI_NODE: ${{ inputs.binary_polkadot_omni_node }}
          GATE_RUNTIME_RELAY: ${{ inputs.runtime_relay }}
          GATE_RUNTIME_INDIVIDUALITY: ${{ inputs.runtime_individuality }}
          GATE_RUNTIME_BULLETIN: ${{ inputs.runtime_bulletin }}
          GATE_RUNTIME_WEB3_STORAGE: ${{ inputs.runtime_web3_storage }}
          GATE_SERVICE_ETH_RPC: ${{ inputs.service_eth_rpc }}
          GATE_SERVICE_IDENTITY_BACKEND: ${{ inputs.service_identity_backend }}
          GATE_ADVANCED: ${{ inputs.advanced }}
        run: |
          set -euo pipefail
          node environments/gate-form.mjs dispatch > ask.json
          {
            echo "target=$(jq -c '.target // empty' ask.json)"
            echo "ppn_ref=$(jq -r '.ppn_ref // empty' ask.json)"
          } >> "$GITHUB_OUTPUT"
          echo "ask: $(cat ask.json)"

      # A caller that built runtimes in this same run hands them over as an
      # artifact. Downloaded here so `plan` can compute transitions against them,
      # and again in the gate job, which is where the files are actually used.
      - name: Download the caller's runtime artifact
        if: inputs.runtime_artifact != ''
        uses: actions/download-artifact@v4
        with:
          # A pattern, not a name: callers commonly upload one artifact per
          # runtime (a build matrix), so `*-runtime` collects them all. A plain
          # name is a pattern that matches itself.
          pattern: ${{ inputs.runtime_artifact }}
          merge-multiple: true
          path: incoming

      - name: Fold the built runtimes into the ask
        id: local
        if: inputs.runtime_artifact != ''
        env:
          NETWORKS: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # One network is enough to name the chains: asset names are per-chain,
          # not per-network, so the overlay applies to every gated network.
          first=$(echo "$NETWORKS" | cut -d, -f1)
          # --dir is relative on purpose: the overlay travels to the gate job on
          # another runner, where an absolute path from this one means nothing.
          node environments/resolve.mjs local-overlay \
            "environments/networks/$first.json" --dir incoming > local-overlay.json
          echo "overlay=$(cat local-overlay.json)" >> "$GITHUB_OUTPUT"

      # The manifest on main is the canonical X (deployed state); the ask Y arrives
      # either as a PR editing it (the diff IS the ask; merging later IS the
      # promotion) or as the dispatch `target` overlay (ephemeral, no PR). A PR may
      # touch several manifests at once; every touched network fans out its own
      # candidates, so the full matrix is networks × candidates, all in parallel.
      - name: Compute the candidate matrix
        id: plan
        env:
          TARGET_JSON: ${{ steps.local.outputs.overlay || steps.ask.outputs.target }}
        run: |
          matrix='[]'
          add() { matrix=$(node -e 'console.log(JSON.stringify(JSON.parse(process.argv[1]).concat(JSON.parse(process.argv[2]))))' "$matrix" "$1"); }
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- 'environments/networks/*.json')
            # A PR that touches no manifest still gates the default set.
            if [ -z "$changed" ]; then
              for net in $(echo "$ENVIRONMENTS" | tr ',' ' '); do changed="$changed environments/networks/$net.json"; done
            fi
            for c in $changed; do
              [ -f "$c" ] || continue  # manifest deleted in this PR
              # Engine-blocked networks stay out of PR runs; dispatch/issue can
              # still run them deliberately (NETWORK_META.gateable).
              meta=$(node environments/resolve.mjs meta "$c")
              if [ "$(echo "$meta" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).gateable===false?"no":"yes"))')" = "no" ]; then
                reason=$(echo "$meta" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).blockedBy??""))')
                echo "::notice::$c is not PR-gateable — $reason"
                echo "- \`$c\` skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
                skipped=1
                continue
              fi
              BASE_ARGS=""
              if git show "origin/${{ github.base_ref }}:$c" > /tmp/base-manifest.json 2>/dev/null; then
                BASE_ARGS="--base /tmp/base-manifest.json"
              fi
              # shellcheck disable=SC2086 # BASE_ARGS is deliberately two words
              add "$(node environments/resolve.mjs candidates "$c" $BASE_ARGS)"
            done
          else
            TARGET_ARGS=""
            if [ -n "$TARGET_JSON" ]; then
              printf '%s' "$TARGET_JSON" > /tmp/target-overlay.json
              TARGET_ARGS="--target /tmp/target-overlay.json"
            fi
            for net in $(echo "$ENVIRONMENTS" | tr ',' ' '); do
              manifest="environments/networks/$net.json"
              if [ ! -f "$manifest" ]; then
                echo "::error::unknown environment \"$net\" — no $manifest"; exit 1
              fi
              # The same overlay is applied to every named network. A pin the
              # network does not carry fails here, per-network, naming the chain.
              # shellcheck disable=SC2086 # TARGET_ARGS is deliberately two words
              add "$(node environments/resolve.mjs candidates "$manifest" $TARGET_ARGS)"
            done
          fi
          if [ "$matrix" = "[]" ] && [ -z "${skipped:-}" ]; then
            echo "::error::no gateable manifests in this change"; exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  gate:
    needs: plan
    # An empty matrix is legitimate: every touched manifest was an
    # engine-blocked (non-PR-gateable) network.
    # A fork PR must never reach the fork job: it runs on Parity's self-hosted
    # runners, and a PR can edit the workflow it runs under. Same-repo branches
    # are fine — only untrusted forks are excluded. Belt and braces alongside the
    # repo's "require approval for outside collaborators" setting.
    if: >-
      needs.plan.outputs.matrix != '[]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    # Its own beefy runner per candidate: each fork binds the engine's fixed ports
    # and runs a five-chain network.
    # Parity's self-hosted groups are enabled for this repo, and a fork spawns a
    # five-chain network — more than a standard hosted runner carries. External
    # callers without that capacity override `runs_on`; a reusable workflow runs
    # on the CALLER's runners, so their label is what applies.
    runs-on: ${{ inputs.runs_on || 'parity-large' }}
    # Budget for the slowest shape: fresh bite (~15m) + two public-relay epoch
    # boundaries (~135m worst case, see NETWORK_META) + converge + suite.
    # Previewnet runs finish in ~25m.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: gate (${{ matrix.candidate.manifest.network }} · ${{ matrix.candidate.id }})
    # Cross terms are rollout-ordering findings, not defects of the target state —
    # only the target gates the PR.
    continue-on-error: ${{ !matrix.candidate.gating }}
    env:
      MANIFEST: candidate-manifest.json
    steps:
      # This workflow's OWN repo. A reusable workflow's `actions/checkout` takes
      # the CALLER's repository by default, so a call from elsewhere would check
      # that out and find none of the resolver, release map or manifests.
      #
      # Pinned to main, not to the caller's ref. `github.job_workflow_sha` and
      # `job_workflow_ref` are documented for reusable workflows but both come
      # back EMPTY in the github context (measured 2026-08-28) — they exist only
      # in OIDC claims. So a caller pinning @v1 runs main's logic; that is a real
      # limitation, not an oversight.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: paritytech/polkadot-pop-e2e
          ref: main

      - name: Materialize the candidate manifest
        run: |
          cat > candidate-manifest.json <<'MANIFEST_EOF'
          ${{ toJSON(matrix.candidate.manifest) }}
          MANIFEST_EOF
          {
            echo "### gate (${{ matrix.candidate.manifest.network }} · ${{ matrix.candidate.id }})"
            echo "${{ matrix.candidate.purpose }}"
            echo ""
            echo "**Transitions under test:** ${{ join(matrix.candidate.transitions, ' · ') }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN cannot read a sibling private repo; GH_PAT must be able
      # to read paritytech/preview-net-v1 (code and releases). Guarded so a missing
      # secret fails with instructions instead of an opaque "repository not found".
      # Preflight the token against exactly the repos THIS manifest pulls from —
      # asked of the resolver, not hardcoded, so it follows pins as they move
      # between private and public (…-community) sources.
      #
      # Only private repos need the token; public ones answer unauthenticated. A
      # bare non-emptiness check used to pass here and then die in the engine
      # checkout with an unexplained 403 (observed 2026-08-27).
      - name: Check prerequisites
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          unreachable=""
          while read -r repo; do
            [ -n "$repo" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo")
            if [ "$code" = "200" ]; then
              echo "  ok        $repo"
            else
              echo "  HTTP $code  $repo"
              unreachable="$unreachable $repo"
            fi
          done < <(node environments/resolve.mjs repos "$MANIFEST")

          if [ -n "$unreachable" ]; then
            echo "::error::GH_PAT cannot read:$unreachable — grant contents:read on each. A fine-grained PAT must select them explicitly; a classic PAT needs SSO authorised for the paritytech org. Public repos need no token at all, so anything listed here is either private or misspelt in the manifest."
            exit 1
          fi

      # The plan job folded these into the pins; this job needs the bytes. Same
      # relative path, so the `file:` pins in the candidate manifest resolve.
      - name: Download the caller's runtime artifact
        if: inputs.runtime_artifact != ''
        uses: actions/download-artifact@v4
        with:
          # A pattern, not a name: callers commonly upload one artifact per
          # runtime (a build matrix), so `*-runtime` collects them all. A plain
          # name is a pattern that matches itself.
          pattern: ${{ inputs.runtime_artifact }}
          merge-multiple: true
          path: incoming

      - name: Checkout the engine (preview-net-v1)
        uses: actions/checkout@v4
        with:
          repository: paritytech/preview-net-v1
          ref: ${{ needs.plan.outputs.ppn_ref || env.PPN_REF_DEFAULT }}
          token: ${{ secrets.GH_PAT }}
          path: ppn

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install make and jq
        run: |
          which make || (apt-get update && apt-get install -y make)
          which jq || (apt-get update && apt-get install -y jq)

      # Resolve before spending minutes on a spawn: a bad manifest (wrong repo, missing
      # asset, unknown chain) should fail in seconds. Binary pins become PPN_BINARIES
      # overrides — exported once here, they reach every engine invocation below
      # (fetch, start, show), applied inside PPN's loader so what fetches, what runs
      # and what `show --json` reports cannot disagree.
      - name: Resolve the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node environments/resolve.mjs overrides "$MANIFEST" | tee -a "$GITHUB_ENV"
          node environments/resolve.mjs runtimes "$MANIFEST" --dir "$GITHUB_WORKSPACE/fork-runtimes" > upgrade-plan.env
          echo "runtime convergence plan:"
          cat upgrade-plan.env

      # FORK=1 so this also downloads (or, with FRESH_BITE=1, bites) the fork bundle.
      # The bite sometimes hangs indefinitely — a known zombie-bite issue; when it
      # works it finishes well inside 30 minutes (observed one CI hang past 2h) — so
      # each attempt is capped and retried from a clean slate.
      - name: Ensure engine dependencies and fetch the fork bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for attempt in 1 2 3; do
            if timeout 1800 make -C ppn ensure-deps FORK=1; then
              jq -r '"bundle bitten \(.bittenAt) against \(.nodeVersion)"' "ppn/$FORK_DIR_NAME/manifest.json"
              exit 0
            fi
            echo "::warning::ensure-deps attempt $attempt failed or hung — cleaning up for a retry"
            make -C ppn kill || true
            pkill -f doppelganger || true
            rm -rf "ppn/$FORK_DIR_NAME"
          done
          echo "::error::no fork bundle after 3 attempts — see the attempts above"
          exit 1

      # `ppn show --json` under the exported overrides is what will actually execute,
      # each overridden slot marked. Fail here on any drift between the engine's
      # wiring and our map, or a pin the engine did not apply — before the spawn.
      - name: Assert the engine agrees with the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          network=$(node -p "require('./$MANIFEST').network")
          node ppn/bin/ppn.mjs show "$network" --json > engine-show.json
          node environments/assert-engine.mjs "$MANIFEST" engine-show.json > engine-agrees.txt
          {
            echo ""
            echo "**Engine resolution (\`ppn show --json\` under our overrides):**"
            sed 's/^/- /' engine-agrees.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reap anything left behind on the runner
        run: make -C ppn kill || true

      # Two attempts: fresh-bite spawns have a rare restore hiccup where a validator
      # never reports up ("Did not finalize blocks in sequential order" family) — a
      # FORK=1 restart wipes the data dir and re-restores the bundle, which clears it.
      - name: Start the fork on the manifest's binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for attempt in 1 2; do
            make -C ppn kill >/dev/null 2>&1 || true
            nohup make -C ppn start FORK=1 > /tmp/fork-spawn.log 2>&1 &
            pid=$!
            # Poll for the relay, but move on the moment the spawn dies — otherwise a
            # make failure in the first second still burns the full timeout.
            for i in $(seq 1 60); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::warning::spawn attempt $attempt exited after $((i * 10))s"
                tail -20 /tmp/fork-spawn.log
                break
              fi
              if curl -sS --fail --max-time 5 -H 'Content-Type: application/json' \
                   -d '{"jsonrpc":"2.0","id":1,"method":"chain_getHeader","params":[]}' \
                   http://127.0.0.1:10000 >/dev/null 2>&1; then
                echo "relay is up after $((i * 10))s (attempt $attempt)"; exit 0
              fi
              sleep 10
            done
          done
          echo "::error::the fork did not come up in 2 spawn attempts"; tail -40 /tmp/fork-spawn.log; exit 1

      # The relay answers within a minute; the collators are still restoring their DB
      # snapshots for several more. Upgrading a chain that is not finalizing yet would
      # time out waiting for enactment and blame the release for a spawn problem.
      # The budget is per-network (FORK_WAIT_SECONDS): forks of the public Paseo
      # relay finalize parachains only at the next hourly session boundary, when
      # the bite's local validator set gets its core assignments.
      - name: Wait for every chain to produce and finalize
        run: node ppn/bin/ppn.mjs fork wait "$GITHUB_WORKSPACE/ppn/$FORK_DIR_NAME" "$FORK_WAIT_SECONDS"

      - name: Verify the fork is healthy pre-upgrade
        run: node ppn/bin/ppn.mjs fork verify "$GITHUB_WORKSPACE/ppn/$FORK_DIR_NAME" 60

      # Relay first (plan order): parachain upgrades pass through the relay's PVF
      # pre-check, so the upgraded relay validates its parachains' new code. A blob the
      # fork already runs is a built-in no-op; each real upgrade exits only after
      # enactment plus five finalized blocks.
      #
      # Downgrades fail the gate: a manifest pin behind what production runs means the
      # manifest is stale, and silently rolling the fork back would gate the wrong
      # thing (caught live: a v0.0.21 bulletin pin downgraded a fork running v0.0.22).
      - name: Converge runtimes to the manifest
        run: |
          # The manifest names only the TARGET runtime (Y); what the fork was running
          # (X) is read from its own state here, and the X → Y line per chain goes to
          # the run summary — an upgrade when they differ, a byte-compare assertion
          # when they match ("already-installed").
          # pipefail, or a failed upgrade hides behind the tee and the loop keeps
          # "converging" a wedged network (observed locally: a bricked relay cost
          # three more 600s waits before anything reported).
          set -o pipefail
          echo "#### Runtime convergence (fork's state → manifest pin)" >> "$GITHUB_STEP_SUMMARY"

          # Chains whose runtime was SUPPLIED as a build rather than a release.
          # Those must actually move: a supplied wasm that upgrades nothing means
          # the build carries the spec_version the chain already runs, so the run
          # exercises the fork machinery and none of the new code — and reports
          # success while testing nothing.
          supplied=$(node -e '
            const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(Object.entries(m.chains ?? {})
              .filter(([, c]) => String(c.runtime ?? "").startsWith("file:"))
              .map(([name]) => name).join(" "));
          ' "$MANIFEST")
          [ -n "$supplied" ] && echo "supplied as a build: $supplied"
          noop=""

          while IFS='=' read -r chain wasm; do
            echo "::group::runtime-upgrade $chain"
            out=$(make -C ppn runtime-upgrade CHAIN="$chain" WASM="$wasm" ALLOW_SAME_SPEC=1 | tee /dev/stderr)
            echo "$out" | grep -E '^OK ' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
            read -r from to < <(echo "$out" | sed -n 's/.*OK [^:]*: [a-z0-9-]* \([0-9][0-9]*\) -> \([0-9][0-9]*\).*/\1 \2/p' | tail -1) || true
            if [ -n "${from:-}" ] && [ -n "${to:-}" ] && [ "$to" -lt "$from" ]; then
              echo "::error::$chain: the manifest pin DOWNGRADES the chain ($from -> $to) — the manifest is behind production, bump the pin"
              exit 1
            fi
            case " $supplied " in
              *" $chain "*)
                if [ -n "${from:-}" ] && [ "${from:-}" = "${to:-}" ]; then
                  noop="$noop $chain"
                fi
                ;;
            esac
            echo "::endgroup::"
          done < upgrade-plan.env

          if [ -n "$noop" ]; then
            echo "::error::a supplied build changed nothing on:$noop — spec_version is the value the chain already runs, so the upgrade was skipped and none of the new code was tested. Stamp a strictly greater spec_version in the build that produced this wasm."
            exit 1
          fi

      - name: Verify the fork is healthy post-upgrade
        run: node ppn/bin/ppn.mjs fork verify "$GITHUB_WORKSPACE/ppn/$FORK_DIR_NAME" 60

      # A polkadot-api client created within a minute or two of an enactment can spiral
      # (see waitForQuiescence in the engine's spawner/src/upgrade/upgrade.ts) — give
      # the swapped runtimes a settle window before pointing fresh test clients at them.
      - name: Let the runtime changes settle
        run: sleep 120

      # postinstall generates the PAPI descriptors from committed .scale metadata.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite derives its fork config from the base network's entry — the manifest
      # knows which network this is a fork of.
      - name: Point the suite at the fork
        run: |
          echo "FORK_OF=$(node -p "require('./$MANIFEST').network")" >> "$GITHUB_ENV"
          echo "NETWORK=local-fork" >> "$GITHUB_ENV"

      # Mirrors _health-check.yml: idempotently deploy the counter contract the
      # PGAS-paid Revive call test uses; the fork usually carries production's already.
      - name: Deploy counter contract
        run: pnpm --filter @pop-e2e/chain-tests deploy-counter

      - name: Run the manifest's chain-tests against the upgraded fork
        run: |
          # Every fork is a fresh world — a cached attested account from an earlier
          # run does not exist on this one (same freshness rule as _health-check.yml).
          rm -f packages/chain-tests/.test-credentials.json
          for t in $(node environments/resolve.mjs tests "$MANIFEST"); do
            echo "::group::$t"
            pnpm --filter @pop-e2e/chain-tests "$t"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-test-results-${{ matrix.candidate.manifest.network }}-${{ matrix.candidate.id }}
          path: packages/chain-tests/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the network
        if: always()
        run: make -C ppn kill || true

      - name: Upload fork logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-fork-logs-${{ matrix.candidate.manifest.network }}-${{ matrix.candidate.id }}
          path: |
            /tmp/fork-spawn.log
            ppn/data*/*/*.log
          retention-days: 7
          if-no-files-found: ignore
