name: K3s CPU isolation spike

# Runs a relay + collator network on parity-large with each node on its own CPU
# cores, using the k3s-network action in .github/actions/k3s-network. The
# network is that action's example, example/network.toml, which has the sizing
# per node.

on:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "How long to watch the chains once they finalize"
        default: "10"
  pull_request:
    paths:
      - .github/workflows/k3s-cpu-spike.yml
      - .github/actions/k3s-network/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike:
    # Self-hosted runner, so never for a PR from a fork.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: parity-large
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start the network on dedicated cores
        uses: ./.github/actions/k3s-network
        # Pinned by digest so a new release cannot change the result. To update,
        # take the new tag's digest from Docker Hub.
        env:
          POLKADOT_IMAGE: docker.io/parity/polkadot:v1.25.0@sha256:d81d252c4226edb31d49b33252686f46119de79dffc6d6c56a1600075808bd62
          CUMULUS_IMAGE: docker.io/parity/polkadot-parachain:v1.25.0@sha256:bcf61ca72bcc79346cf68dffcec015b95e11b02b1aaf704893079a42d4afc70f
        with:
          network: .github/actions/k3s-network/example/network.toml
          namespace: zombie-pop-spike
          chains: alice asset-hub-collator people-collator coretime-collator
          soak-minutes: ${{ inputs.soak_minutes || '10' }}

      - name: Collect logs
        if: always()
        uses: ./.github/actions/k3s-network/collect-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3s-cpu-spike-logs
          path: logs
          retention-days: 7
