name: Coinage remaining-flow campaign
on:
  workflow_dispatch:
    inputs:
      smoke-only:
        description: Run only four one-actor smoke gates
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: coinage-remaining-flow-campaign
  cancel-in-progress: false
jobs:
  smoke_merchant:
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: merchant
      actors: '1'
      smoke-only: 'true'

  smoke_quota:
    needs: [smoke_merchant]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: quota
      actors: '1'
      smoke-only: 'true'

  smoke_offboard:
    needs: [smoke_quota]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: offboard
      actors: '1'
      smoke-only: 'true'

  smoke_full_flow:
    needs: [smoke_offboard]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: full-flow
      actors: '1'
      smoke-only: 'true'

  merchant_1:
    needs: [smoke_full_flow, smoke_merchant]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_merchant.result == 'success' }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: merchant
      actors: '100'
      mode: burst
      pool: default
      pool-transactions: '11000'

  merchant_2:
    needs: [merchant_1, smoke_merchant]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_merchant.result == 'success' }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: merchant
      actors: '1000'
      mode: burst
      pool: default
      pool-transactions: '11000'

  merchant_3:
    needs: [merchant_2, smoke_merchant]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_merchant.result == 'success' }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: merchant
      actors: '10000'
      mode: burst
      pool: default
      pool-transactions: '11000'

  merchant_4:
    needs: [merchant_3, smoke_merchant]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_merchant.result == 'success' }}
    uses: ./.github/workflows/coinage-remaining-flow-pilot.yml
    with:
      scenario: merchant
      actors: '10000'
      mode: paced
      pool: default
      pool-transactions: '11000'

  merchant_5:
