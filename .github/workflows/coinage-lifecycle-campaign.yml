name: Sequential Coinage lifecycle campaign

on:
  workflow_dispatch:
  push:
    branches: [feat/th-coinage-lifecycle-pilots]
    paths:
      - .github/workflows/coinage-lifecycle*.yml
      - packages/chain-tests/scripts/coinage-lifecycle-pilot.ts
      - packages/chain-tests/src/lib/coinage-lifecycle*
      - ci/previewnet/*lifecycle*

permissions:
  contents: read
  actions: read

concurrency:
  group: coinage-lifecycle-campaign
  cancel-in-progress: false

# Every case has its own disposable network and artifacts. A red case is evidence,
# not permission to skip the rest. Only the two failed-baseline fallbacks are conditional.
jobs:
  a100:
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '100'
      mode: burst
      pool: default
      pool-transactions: '11000'
  a1000:
    needs: [a100]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '1000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  a10000:
    needs: [a1000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '10000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  b100:
    needs: [a10000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '100'
      mode: burst
      pool: default
      pool-transactions: '11000'
  b1000:
    needs: [b100]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '1000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  b10000:
    needs: [b1000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '10000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  a_paced:
    needs: [b10000, a10000]
    if: ${{ always() && !cancelled() && needs.a10000.result == 'failure' }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '10000'
      mode: paced
      pool: default
      pool-transactions: '11000'
  a_pool:
    needs: [a_paced, a10000]
    if: ${{ always() && !cancelled() && needs.a10000.result == 'failure' }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '10000'
      mode: burst
      pool: enlarged
      pool-transactions: '11000'
  b_paced:
    needs: [a_pool, b10000]
    if: ${{ always() && !cancelled() && needs.b10000.result == 'failure' }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '10000'
      mode: paced
      pool: default
      pool-transactions: '11000'
  b_pool:
    needs: [b_paced, b10000]
    if: ${{ always() && !cancelled() && needs.b10000.result == 'failure' }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '10000'
      mode: burst
      pool: enlarged
      pool-transactions: '11000'
  a20000:
    needs: [b_pool]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '20000'
      mode: burst
      pool: enlarged
      pool-transactions: '22000'
  a40000:
    needs: [a20000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '40000'
      mode: burst
      pool: enlarged
      pool-transactions: '44000'
  a100000:
    needs: [a40000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '100000'
      mode: burst
      pool: enlarged
      pool-transactions: '110000'
  b20000:
    needs: [a100000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '20000'
      mode: burst
      pool: enlarged
      pool-transactions: '22000'
  b40000:
    needs: [b20000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '40000'
      mode: burst
      pool: enlarged
      pool-transactions: '44000'
  b100000:
    needs: [b40000]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '100000'
      mode: burst
      pool: enlarged
      pool-transactions: '110000'

  report:
    needs: [a100, a1000, a10000, b100, b1000, b10000, a_paced, a_pool, b_paced, b_pool, a20000, a40000, a100000, b20000, b40000, b100000]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Record all case conclusions
        env:
          CASES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          cases = json.loads(os.environ['CASES'])
          Path('campaign-conclusions.json').write_text(json.dumps(cases, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('# Lifecycle campaign\n\nCI conclusions are not receipt verification. Inspect each case artifact.\n\n| Case | CI conclusion |\n| --- | --- |\n')
              for name, result in cases.items():
                  out.write(f"| {name} | {result['result']} |\n")
          PYREPORT
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-campaign-conclusions-${{ github.run_id }}-${{ github.run_attempt }}
          path: campaign-conclusions.json
          retention-days: 30
