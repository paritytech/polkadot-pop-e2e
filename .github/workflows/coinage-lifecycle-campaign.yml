name: Sequential Coinage lifecycle campaign

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'JSON case IDs to run, or ["all"] for the full campaign'
        type: string
        default: '["all"]'

permissions:
  contents: read
  actions: read

concurrency:
  group: coinage-lifecycle-campaign
  cancel-in-progress: false

# Every case has its own disposable network and artifacts. A red case is evidence,
# not permission to skip the rest. Only the two failed-baseline fallbacks are conditional.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected cases
        env:
          CASES: ${{ inputs.cases }}
        run: |
          python3 - <<'PYCASES'
          import json, os
          cases = json.loads(os.environ['CASES'])
          allowed = {'all', 'a100', 'a1000', 'a10000', 'b100', 'b1000', 'b10000',
                     'a_paced', 'a_pool', 'b_paced', 'b_pool', 'a20000', 'a40000',
                     'a100000', 'b20000', 'b40000', 'b100000'}
          assert isinstance(cases, list) and cases
          assert all(isinstance(case, str) for case in cases)
          assert len(cases) == len(set(cases)) and set(cases) <= allowed
          assert 'all' not in cases or cases == ['all']
          print('Selected:', ', '.join(cases))
          PYCASES
  a100:
    needs: [validate]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a100') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '100'
      mode: burst
      pool: default
      pool-transactions: '11000'
  a1000:
    needs: [validate, a100]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a1000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '1000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  a10000:
    needs: [validate, a1000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a10000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '10000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  b100:
    needs: [validate, a10000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b100') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '100'
      mode: burst
      pool: default
      pool-transactions: '11000'
  b1000:
    needs: [validate, b100]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b1000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '1000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  b10000:
    needs: [validate, b1000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b10000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '10000'
      mode: burst
      pool: default
      pool-transactions: '11000'
  a_paced:
    needs: [validate, b10000, a10000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a_paced') || (contains(fromJSON(inputs.cases || '["all"]'), 'all') && needs.a10000.result == 'failure')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '10000'
      mode: paced
      pool: default
      pool-transactions: '11000'
  a_pool:
    needs: [validate, a_paced, a10000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a_pool') || (contains(fromJSON(inputs.cases || '["all"]'), 'all') && needs.a10000.result == 'failure')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '10000'
      mode: burst
      pool: enlarged
      pool-transactions: '11000'
  b_paced:
    needs: [validate, a_pool, b10000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b_paced') || (contains(fromJSON(inputs.cases || '["all"]'), 'all') && needs.b10000.result == 'failure')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '10000'
      mode: paced
      pool: default
      pool-transactions: '11000'
  b_pool:
    needs: [validate, b_paced, b10000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b_pool') || (contains(fromJSON(inputs.cases || '["all"]'), 'all') && needs.b10000.result == 'failure')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '10000'
      mode: burst
      pool: enlarged
      pool-transactions: '11000'
  a20000:
    needs: [validate, b_pool]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a20000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '20000'
      mode: burst
      pool: enlarged
      pool-transactions: '22000'
  a40000:
    needs: [validate, a20000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a40000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '40000'
      mode: burst
      pool: enlarged
      pool-transactions: '44000'
  a100000:
    needs: [validate, a40000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'a100000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: split
      actors: '100000'
      mode: burst
      pool: enlarged
      pool-transactions: '110000'
  b20000:
    needs: [validate, a100000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b20000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '20000'
      mode: burst
      pool: enlarged
      pool-transactions: '22000'
  b40000:
    needs: [validate, b20000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b40000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '40000'
      mode: burst
      pool: enlarged
      pool-transactions: '44000'
  b100000:
    needs: [validate, b40000]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && (contains(fromJSON(inputs.cases || '["all"]'), 'b100000') || contains(fromJSON(inputs.cases || '["all"]'), 'all')) }}
    uses: ./.github/workflows/coinage-lifecycle-pilots.yml
    with:
      scenario: recycle
      actors: '100000'
      mode: burst
      pool: enlarged
      pool-transactions: '110000'

  report:
    needs: [validate, a100, a1000, a10000, b100, b1000, b10000, a_paced, a_pool, b_paced, b_pool, a20000, a40000, a100000, b20000, b40000, b100000]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Record all case conclusions
        env:
          CASES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          cases = json.loads(os.environ['CASES'])
          Path('campaign-conclusions.json').write_text(json.dumps(cases, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('# Lifecycle campaign\n\nCI conclusions are not receipt verification. Inspect each case artifact.\n\n| Case | CI conclusion |\n| --- | --- |\n')
              for name, result in cases.items():
                  out.write(f"| {name} | {result['result']} |\n")
          PYREPORT
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-campaign-conclusions-${{ github.run_id }}-${{ github.run_attempt }}
          path: campaign-conclusions.json
          retention-days: 30
