name: Coinage three-minute ready-pool campaign
on:
  workflow_dispatch:
    inputs:
      smoke-only:
        description: Validate all eight drivers without running the 8k holds
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: coinage-remaining-flow-campaign
  cancel-in-progress: false
jobs:
  smoke_topup:
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: topup
      actors: '20'
      smoke-only: 'true'
  hold_topup:
    needs: [smoke_topup]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_topup.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: topup
      actors: '20000'
      smoke-only: 'false'
  smoke_claim:
    needs: [hold_topup]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: claim
      actors: '20'
      smoke-only: 'true'
  hold_claim:
    needs: [smoke_claim]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_claim.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: claim
      actors: '250000'
      smoke-only: 'false'
  smoke_split:
    needs: [hold_claim]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: split
      actors: '20'
      smoke-only: 'true'
  hold_split:
    needs: [smoke_split]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_split.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: split
      actors: '50000'
      smoke-only: 'false'
  smoke_recycle:
    needs: [hold_split]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: recycle
      actors: '20'
      smoke-only: 'true'
  hold_recycle:
    needs: [smoke_recycle]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_recycle.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: recycle
      actors: '40000'
      smoke-only: 'false'
  smoke_merchant:
    needs: [hold_recycle]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: merchant
      actors: '20'
      smoke-only: 'true'
  hold_merchant:
    needs: [smoke_merchant]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_merchant.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: merchant
      actors: '250000'
      smoke-only: 'false'
  smoke_quota:
    needs: [hold_merchant]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: quota
      actors: '20'
      smoke-only: 'true'
  hold_quota:
    needs: [smoke_quota]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_quota.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: quota
      actors: '20000'
      smoke-only: 'false'
  smoke_offboard:
    needs: [hold_quota]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: offboard
      actors: '20'
      smoke-only: 'true'
  hold_offboard:
    needs: [smoke_offboard]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_offboard.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: offboard
      actors: '20000'
      smoke-only: 'false'
  smoke_full_flow:
    needs: [hold_offboard]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: full-flow
      actors: '20'
      smoke-only: 'true'
  hold_full_flow:
    needs: [smoke_full_flow]
    if: ${{ always() && !cancelled() && !inputs.smoke-only && needs.smoke_full_flow.result == 'success' }}
    uses: ./.github/workflows/coinage-sustained-pilot.yml
    with:
      scenario: full-flow
      actors: '20000'
      smoke-only: 'false'
