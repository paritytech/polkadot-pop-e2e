name: Load test
run-name: "${{ inputs.people_only && 'Lite people' || 'Load test' }} · ${{ inputs.network }} · ${{ inputs.players }} bots${{ inputs.lite && ' · lite' || '' }}${{ inputs.video && ' · video' || '' }}${{ inputs.chain_backend == 'light-client' && ' · light client' || '' }}${{ inputs.game_at != '' && format(' · game {0}', inputs.game_at) || '' }}${{ inputs.start_at != '' && format(' · starts {0}', inputs.start_at) || '' }}${{ inputs.replay_at != '' && format(' · replay {0}', inputs.replay_at) || '' }}${{ inputs.args != '' && format(' · {0}', inputs.args) || '' }}"

# Plays the closest scheduled Jollity game on a live network with N bots as regular players: they
# sign up, exchange the app's pre-game messages through truapi-host, report and claim their NFTs.
# With `replay_at`, the bots of an earlier game exchange the same messages without a game.
# See packages/load-tests/README.md.

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network whose closest scheduled game the bots join
        type: choice
        default: previewnet
        options: [previewnet, paseo-next-v2]
      players:
        description: Bots in the game, up to 5000; with people_only, the lite bots to make
        type: string
        default: "300"
      bots_per_machine:
        description: "Bots one machine sends messages for; empty for the mode's default per parity-large: 1000 bots, 400 lite bots, 400 video bots, 150 lite video bots, at most 350 with light-client and 150 with light-client and video"
        type: string
        default: ""
      lite:
        description: The bots are lite people (made once with `load people`) that sign up free; each runs in its own truapi-host
        type: boolean
        default: false
      video:
        description: "Bots play H.264 video to their group over real WebRTC links, as phones do; lite bots through TURN credentials from the network's issuer"
        type: boolean
        default: false
      timing:
        description: "sync: every bot opens its room at the same instant, as the app does. random: each up to one heartbeat later, to see what spreading the burst does"
        type: choice
        default: sync
        options: [sync, random]
      claim:
        description: Claim the NFT credits on Asset Hub after the reports
        type: boolean
        default: true
      game_at:
        description: Play time (ISO or unix seconds) of the scheduled game to join; empty joins the closest one
        type: string
        default: ""
      replay_at:
        description: "Start time (ISO) of a replay without a game: the bots of an earlier game exchange the same messages, without sign-up, reports or claims; empty plays a game"
        type: string
        default: ""
      chain_backend:
        description: "How truapi-host connects to People: rpc (WebSocket JSON-RPC) or light-client (embedded smoldot, statements over peer-to-peer gossip)"
        type: choice
        default: rpc
        options: [rpc, light-client]
      host_log:
        description: "truapi-host log level; debug records why each connection to People ended, in the uploaded host logs"
        type: choice
        default: info
        options: [info, debug]
      args:
        description: More load CLI options, such as "--connections 16". Changing --ghosts-per-host or --seed plays new, unfunded bots
        type: string
        default: ""
      people_only:
        description: "Only make lite bots --lite-from.. of players lite people (`load people`), resuming where an earlier run stopped; no game. Attests 3 at a time, or --attest-concurrency in args"
        type: boolean
        default: false
      start_at:
        description: "UTC time (ISO, e.g. 2026-11-25T12:15:00Z) at which the run starts its work; empty starts now. Small runners wait until then, at most about 23 hours; the target game is checked against the chain's schedule right away"
        type: string
        default: ""

permissions:
  contents: read

# Only one run makes a network's lite people at a time. Game runs don't queue: a run's chain job
# stays on after its game for reports, claims and the summary, which would hold back the next
# game's sign-ups, and a later game's run signs its bots up after the earlier game has closed.
concurrency:
  group: load-test-${{ inputs.network }}-${{ inputs.people_only && 'people' || github.run_id }}
  cancel-in-progress: false

env:
  NETWORK: ${{ inputs.network }}
  # truapi-host rejects previewnet when its built-in descriptor is older than the published one,
  # so previewnet runs read the published stack, which truapi-host takes over RPC only.
  STACK: ${{ inputs.network == 'previewnet' && 'https://previewnet.substrate.dev/.well-known/trinity-stack.json' || '' }}
  PLAYERS: ${{ inputs.players }}
  ARGS: ${{ inputs.args }}
  GAME_AT: ${{ inputs.game_at }}
  LITE: ${{ inputs.lite }}
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  RESULTS: ${{ github.workspace }}/load-results
  TRUAPI_HOST_NO_UPDATE: "1"

jobs:
  # Lets a run be dispatched ahead and start its work at `start_at` without anyone online. It runs
  # on every game run, as a no-op without start_at, so no job after it is skipped. A job may run
  # 6 hours at most, so the wait runs as up to 4 legs one after another, about 23 hours in all.
  wait:
    name: wait for start_at (leg ${{ matrix.leg }})
    if: ${{ !inputs.people_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      matrix:
        leg: [1, 2, 3, 4]
    steps:
      # A run dispatched ahead for a game that isn't scheduled fails now, while someone can still fix it.
      - if: ${{ inputs.start_at != '' && matrix.leg == 1 && inputs.replay_at == '' }}
        uses: actions/checkout@v4
      - if: ${{ inputs.start_at != '' && matrix.leg == 1 && inputs.replay_at == '' }}
        uses: pnpm/action-setup@v4
      - if: ${{ inputs.start_at != '' && matrix.leg == 1 && inputs.replay_at == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - if: ${{ inputs.start_at != '' && matrix.leg == 1 && inputs.replay_at == '' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          read -ra extra <<< "$ARGS"
          game=()
          if [ -n "$GAME_AT" ]; then game+=(--game-at "$GAME_AT"); fi
          if [ "$LITE" = true ]; then game+=(--lite); fi
          pnpm --silent --filter @pop-e2e/load-tests load target --players "$PLAYERS" "${game[@]}" "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - env:
          START_AT: ${{ inputs.start_at }}
        run: |
          [[ -n "$START_AT" ]] || exit 0
          start=$(date -u -d "$START_AT" +%s) || { echo "start_at '$START_AT' is not a time" >&2; exit 1; }
          wait=$(( start - $(date -u +%s) ))
          (( wait > 20700 )) && wait=20700
          if (( wait > 0 )); then echo "waiting ${wait}s towards $START_AT"; sleep "$wait"; fi
          echo "leg done at $(date -u +%FT%TZ)"

  plan:
    name: plan
    needs: wait
    if: ${{ !inputs.people_only }}
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.plan.outputs.machines }}
      shards: ${{ steps.plan.outputs.shards }}
      game_at: ${{ steps.target.outputs.game_at }}
    steps:
      - id: plan
        env:
          PER_MACHINE: ${{ inputs.bots_per_machine }}
          VIDEO: ${{ inputs.video }}
          CHAIN_BACKEND: ${{ inputs.chain_backend }}
        run: |
          set -euo pipefail
          if [ "$NETWORK" = previewnet ] && [ "$CHAIN_BACKEND" = light-client ]; then
            echo "::error::previewnet runs read the published stack, which truapi-host takes over RPC only: use chain_backend rpc"
            exit 1
          fi
          # Bots per parity-large and how to recalibrate them: packages/load-tests/README.md#video
          case "$LITE/$VIDEO" in
            true/true) default=150 ;;
            false/true) default=400 ;;
            true/false) default=400 ;;
            *) default=1000 ;;
          esac
          if [ "$CHAIN_BACKEND" = light-client ]; then
            cap=$([ "$VIDEO" = true ] && echo 150 || echo 350)
            [ "$default" -gt "$cap" ] && default=$cap
          fi
          per=${PER_MACHINE:-$default}
          machines=$(( (PLAYERS + per - 1) / per ))
          echo "machines=$machines" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((machines - 1)))]" >> "$GITHUB_OUTPUT"
          echo "$PLAYERS bots, $per per machine on $machines parity-large machine(s), lite $LITE, video $VIDEO, timing ${{ inputs.timing }}, claims ${{ inputs.claim }}" >> "$GITHUB_STEP_SUMMARY"
      # The run's game, picked once: the chain job signs up to it and every message machine plays
      # it, whatever game another run has the same bots signed up to.
      - if: ${{ inputs.replay_at == '' }}
        uses: actions/checkout@v4
      - if: ${{ inputs.replay_at == '' }}
        uses: pnpm/action-setup@v4
      - if: ${{ inputs.replay_at == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - if: ${{ inputs.replay_at == '' }}
        run: pnpm install --frozen-lockfile
      - id: target
        if: ${{ inputs.replay_at == '' }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$ARGS"
          game=()
          if [ -n "$GAME_AT" ]; then game+=(--game-at "$GAME_AT"); fi
          if [ "$LITE" = true ]; then game+=(--lite); fi
          pnpm --silent --filter @pop-e2e/load-tests load target --players "$PLAYERS" "${game[@]}" "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Signs every bot up as soon as the game takes sign-ups, then reports and claims for all of
  # them. The TEST_MNEMONIC account pays their play deposits and fees.
  chain:
    name: chain · sign-up, reports, NFT claims
    needs: plan
    if: ${{ !inputs.people_only && inputs.replay_at == '' }}
    runs-on: ubuntu-latest
    # Up to 4 h until the game, then its reporting and the claims; GitHub-hosted jobs stop at 6 h.
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Play the game on chain
        env:
          CLAIM: ${{ inputs.claim }}
          GAME_AT: ${{ needs.plan.outputs.game_at }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$ARGS"
          game=(--registration-wait 240)
          if [ -n "$GAME_AT" ]; then game+=(--game-at "$GAME_AT"); fi
          if [ "$CLAIM" != true ]; then game+=(--skip-claim); fi
          if [ "$LITE" = true ]; then game+=(--lite); fi
          pnpm --silent --filter @pop-e2e/load-tests load chain --players "$PLAYERS" "${game[@]}" \
            --run-id "$RUN_ID" --out "$RESULTS" "${extra[@]}"
      - name: Upload the chain result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-chain
          path: load-results/
          retention-days: 14
          if-no-files-found: ignore

  # A run whose chain job stops early has no game for its message machines: stop them too.
  cancel:
    name: cancel the run when the chain job fails
    needs: chain
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  # Each machine waits until the chain job has signed its bots up, or until `replay_at`, then runs
  # them inside truapi-host from 40 s before the game's room opens until the game ends. With
  # video, each bot also connects to its co-players and sends them about 1.5 Mbit/s of video each way.
  messages:
    name: messages · machine ${{ matrix.shard }}
    needs: plan
    runs-on: parity-large
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-truapi-host
      - uses: oven-sh/setup-bun@v2
      - name: Send and receive the game's messages
        env:
          SHARD: ${{ matrix.shard }}
          MACHINES: ${{ needs.plan.outputs.machines }}
          PHASE: ${{ inputs.timing }}
          REPLAY_AT: ${{ inputs.replay_at }}
          GAME_AT: ${{ needs.plan.outputs.game_at }}
          TRUAPI_CHAIN_BACKEND: ${{ inputs.chain_backend }}
          TRUAPI_HOST_LOG: ${{ inputs.host_log }}
          VIDEO: ${{ inputs.video }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$ARGS"
          if [ -n "$REPLAY_AT" ]; then start=(--start-at "$REPLAY_AT"); else start=(--follow-game --game-at "$GAME_AT" --registration-wait 240); fi
          if [ "$VIDEO" = true ]; then start+=(--video); fi
          if [ "$LITE" = true ]; then start+=(--lite); fi
          pnpm --silent --filter @pop-e2e/load-tests load host "${start[@]}" --steps "$PLAYERS" --phase "$PHASE" \
            --shard "$SHARD/$MACHINES" --run-id "$RUN_ID" --out "$RESULTS" "${extra[@]}"
      - name: Upload the message results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-messages-${{ matrix.shard }}
          path: load-results/
          retention-days: 14
          if-no-files-found: ignore

  summary:
    name: summary
    needs: [chain, messages]
    if: ${{ always() && !inputs.people_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: load-*
          path: load-results
          merge-multiple: true
      - name: Merge the results
        env:
          REPLAY_AT: ${{ inputs.replay_at }}
        run: |
          set -euo pipefail
          if [ -z "$REPLAY_AT" ] && ! compgen -G "load-results/chain.n*.md" >/dev/null; then echo "No chain result" >> "$GITHUB_STEP_SUMMARY"; fi
          if compgen -G "load-results/host.n*.shard*.json" >/dev/null; then
            pnpm --silent --filter @pop-e2e/load-tests load summary --out "$RESULTS"
          else
            echo "No message results" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: load-results-${{ inputs.network }}-${{ inputs.players }}
          path: load-results/
          retention-days: 14

  # Resumable: a rerun skips the bots that are lite people already, so a timeout or a cancel
  # loses only the attests in flight.
  people:
    name: people · make lite bots
    if: ${{ inputs.people_only }}
    runs-on: parity-large
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-truapi-host
      - name: Make the lite people
        run: |
          set -euo pipefail
          read -ra extra <<< "$ARGS"
          status=0
          pnpm --silent --filter @pop-e2e/load-tests load people --players "$PLAYERS" "${extra[@]}" 2>&1 | tee people.log || status=$?
          sed -n '/^### Lite people/,$p' people.log >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
